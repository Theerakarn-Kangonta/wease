<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Wease</title>
<meta name="description" content="Play music files from your device. No ads, no uploads.">
<meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wease">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"><i></i><i></i></div>
<div class="app">
  <header class="top">
    <h1 class="brand" id="brand">Wease</h1>
    <div class="search" id="searchBar" hidden>
      <input id="q" type="search" placeholder="Search" aria-label="Search songs" autocomplete="off" enterkeyhint="search">
      <button class="ic" id="searchClose" type="button" aria-label="Close search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <div class="top-act" id="topAct">
      <button class="ic" id="installBtn" type="button" aria-label="Install app" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>
      <button class="ic" id="searchBtn" type="button" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button class="ic add" id="addBtn" type="button" aria-label="Add songs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
    </div>
  </header>

  <nav class="libbar" aria-label="Library and playlists">
    <div class="tabs" id="tabs"></div>
    <button class="ic" id="libMenu" type="button" aria-label="Options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
  </nav>

  <main class="listwrap" id="listwrap">
    <ol id="list"></ol>
    <div class="empty" id="empty" hidden>
      <div class="empty-disc" aria-hidden="true"></div>
      <p id="emptyT" hidden></p>
      <button class="btn primary" id="emptyBtn" type="button">Add songs</button>
    </div>
  </main>

  <section class="lyrics" id="lyrics" aria-label="Lyrics" hidden>
    <button class="ic lyr-close" id="lyrClose" type="button" aria-label="Close lyrics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    <div class="lyr-body" id="lyrBody"></div>
  </section>

  <footer class="player" id="player" hidden>
    <div class="np-row">
      <div class="disc" id="disc"><div class="label"></div></div>
      <div class="np">
        <p class="t" id="npTitle"></p>
        <p class="a" id="npArtist"></p>
      </div>
      <button class="ic lyr-btn" id="lyrBtn" type="button" aria-label="Lyrics" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12v2H4zm0 4h12v2H4zm0 4h8v2H4zm14.5-4.9V16a2.5 2.5 0 1 1-1.5-2.29V7h4v2.1z"/></svg></button>
      <button class="ic tune" id="tuneBtn" type="button" aria-label="Sleep timer, speed and volume"><span class="tune-txt" id="tuneTxt" hidden></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></button>
    </div>
    <div class="seek">
      <div class="wave loading" id="wave" role="slider" tabindex="0" aria-label="Song position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="waveBase"></canvas><canvas id="waveTop"></canvas>
        <span class="wave-tip" id="waveTip" hidden>0:00</span>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrls">
      <button class="ic toggle" id="shuffle" type="button" aria-pressed="false" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="ic big" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ic play" id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic big" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="ic toggle" id="repeat" type="button" aria-pressed="false" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="badge" id="rbadge"></span></button>
    </div>
  </footer>
</div>

<input id="files" class="vh" type="file" multiple tabindex="-1" aria-hidden="true">
<input id="folder" class="vh" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" hidden></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-hd">
    <div class="sheet-tt"><h3 id="sheetTitle" tabindex="-1" autofocus></h3><p class="sheet-sub" id="sheetSub" hidden></p></div>
    <button class="ic" id="sheetClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>
  <div class="sheet-bd" id="sheetBody"></div>
</dialog>

<audio id="audio" preload="auto" playsinline></audio>
</body>
</html>
